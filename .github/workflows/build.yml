name: Build NovaVisual

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: gradle build
      - name: Package source ZIP
        run: |
          mkdir -p dist
          zip -r dist/NovaVisual-source-${GITHUB_REF_NAME}.zip . -x '.git/*' '.gradle/*' 'build/*' 'dist/*'
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: NovaVisual-${GITHUB_REF_NAME}
          path: |
            build/libs/*.jar
            dist/*.zip
          if-no-files-found: error
